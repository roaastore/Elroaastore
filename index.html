<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b3318">
<meta name="referrer" content="no-referrer">
<title>المتجر</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://brwiytvwmnvbiwxywqhn.supabase.co" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
a{color:var(--link)}
.hide{display:none!important}

/* ---- الهيدر ---- */
.top{position:sticky;top:0;z-index:30;background:var(--nav);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.3rem;cursor:pointer;padding:4px 8px;border:1px solid transparent;border-radius:4px}
.brand:hover,.hbtn:hover,.cartbtn:hover{border-color:#fff}
.logo{width:34px;height:34px;border-radius:8px;background:var(--org);display:grid;place-items:center;font-size:1.1rem}
.search{flex:1 1 320px;display:flex;min-width:0;order:2;border-radius:8px;overflow:hidden}
.search input{flex:1;min-width:0;border:0;border-radius:0;background:#fff;color:#0f1111;padding:10px 14px;outline:none}
.search button{background:var(--org);color:var(--nav);padding:0 18px;font-size:1.1rem}
.search button:hover{background:#fa8900}
.acts{display:flex;align-items:center;gap:6px;margin-inline-start:auto;order:1}
.hbtn,.cartbtn{background:transparent;color:#fff;border:1px solid transparent;border-radius:4px;padding:4px 10px;text-align:start;line-height:1.25;white-space:nowrap}
.hbtn small{display:block;font-size:.72rem;color:#ccc;font-weight:400}
.hbtn b{font-size:.9rem}
.cartbtn{display:flex;align-items:center;gap:6px;font-weight:700}
.cartbtn .ic{font-size:1.5rem;position:relative}
.cartbtn .cn{position:absolute;top:-9px;inset-inline-end:-6px;background:var(--org);color:var(--nav);font-size:.78rem;font-weight:800;min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
@media(min-width:900px){.search{order:1;flex:1 1 auto}
.acts{order:2;margin-inline-start:0}
}
nav.sub{background:var(--nav2);display:flex;gap:2px;overflow-x:auto;padding:0 10px;position:sticky;top:var(--hh,100px);z-index:29}
nav.sub button{position:relative;background:transparent;color:#fff;font-weight:600;padding:10px 14px;white-space:nowrap;border:1px solid transparent;border-radius:3px;font-size:.92rem}
nav.sub button:hover{border-color:#fff}
nav.sub button.on{border-bottom:3px solid var(--org);border-radius:0}
.badge{position:absolute;top:2px;inset-inline-start:2px;background:var(--org);color:var(--nav);border-radius:99px;font-size:.68rem;font-weight:800;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
main{max-width:1280px;margin:0 auto;padding:14px 14px 40px}
h2{font-size:1.35rem;margin-bottom:12px;font-weight:700}
h3{font-size:1.05rem;font-weight:700}

/* ---- بطاقات عامة ---- */
.card{background:var(--card);border:1px solid var(--br);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:18px}
.stat b{display:block;font-size:1.5rem;font-weight:800}
.stat span{color:var(--mut);font-size:.85rem}

/* ---- الهيرو ---- */
.hero-b{background:linear-gradient(120deg,var(--nav2),#37475a 60%,#485769);color:#fff;border-radius:var(--r);padding:26px 22px;margin-bottom:14px;position:relative;overflow:hidden}
.hero-b:after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,153,0,.22)}
.hero-b h1{font-size:1.5rem;font-weight:800;position:relative}
.hero-b p{opacity:.9;position:relative;margin-top:4px}
.hero-b .tag{display:inline-block;background:var(--org);color:var(--nav);font-weight:800;font-size:.8rem;border-radius:4px;padding:1px 10px;margin-bottom:8px;position:relative}

/* ---- التصنيفات ---- */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px}
.chip{background:#fff;border:1px solid var(--br);border-radius:99px;padding:5px 16px;white-space:nowrap;font-weight:600;color:var(--tx)}
.chip:hover{background:#f7fafa}
.chip.on{background:var(--nav2);color:#fff;border-color:var(--nav2)}

/* ---- المنتجات ---- */
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
.pc{background:#fff;border:1px solid var(--br);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s}
.pc:hover{box-shadow:0 4px 14px rgba(15,17,17,.2)}
.pimg{aspect-ratio:1/1;background:#fff;display:grid;place-items:center;position:relative;overflow:hidden;border-bottom:1px solid #f0f2f2}
.pimg img{width:100%;height:100%;object-fit:contain;padding:8px}
.pimg .ph{width:100%;height:100%;display:grid;place-items:center;font-size:3.2rem;font-weight:800;color:#fff;background:linear-gradient(135deg,#8d9db6,#5b6b84)}
.disc{position:absolute;top:8px;inset-inline-start:8px;background:var(--bad);color:#fff;border-radius:4px;padding:1px 8px;font-size:.78rem;font-weight:700}
.pb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pname{font-weight:600;font-size:.98rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.old{color:var(--mut);text-decoration:line-through;font-size:.85rem;margin-inline-start:8px;font-weight:400}
.ship{font-size:.78rem;color:var(--mut)}
.ship b{color:var(--link)}
.buy:disabled{background:#e7e7e7;border-color:#d5d9d9;color:#888;cursor:not-allowed}

/* ---- أزرار ---- */
.btn{background:var(--yel);color:var(--tx);border:1px solid #fcd200;border-radius:99px;padding:9px 18px;font-weight:700;transition:.12s}
.btn:hover{background:var(--yel2)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55}
.btn.sec{background:#fff;color:var(--tx);border:1px solid var(--br)}
.btn.sec:hover{background:#f7fafa}
.btn.ok{background:var(--buy);border-color:#ff8f00}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 12px;font-size:.85rem}
.btn.dng{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn.dng:hover{background:#fdecea}
.undo{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fff8e6;border:1px solid #fde1a0;color:#6b4a00;border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-weight:600}
.btn.wa{background:#25d366;border-color:#1fb956;color:#fff}

/* ---- نماذج ---- */
input,select,textarea{width:100%;background:#fff;border:1px solid #a6a6a6;border-radius:6px;padding:9px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#e77600;box-shadow:0 0 0 3px rgba(228,121,17,.2)}
input:disabled{background:#f3f3f3}
label{display:block;font-weight:700;font-size:.88rem;margin:10px 0 4px}
label.ck{display:flex;gap:8px;align-items:center;font-weight:600}
label.ck input{width:auto}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}

/* ---- حالات الطلب ---- */
.st{display:inline-block;border-radius:4px;padding:1px 10px;font-size:.8rem;font-weight:700}
.st.new{background:#fef3c7;color:#92400e}
.st.confirmed{background:#dbeafe;color:#1e40af}
.st.shipped{background:#e0e7ff;color:#3730a3}
.st.delivered{background:#d1fae5;color:#065f46}
.st.cancelled{background:#fee2e2;color:#991b1b}
.rb{display:inline-block;border-radius:4px;padding:0 8px;font-size:.78rem;font-weight:700}
.rb.admin{background:#232f3e;color:#fff}
.rb.customer{background:#e7e7e7;color:#333}
.nw{display:inline-block;background:var(--org);color:var(--nav);border-radius:4px;padding:0 6px;font-size:.7rem;font-weight:800;margin-inline-start:6px}
.ocard{margin-bottom:12px}
.ocard.fresh{border-color:var(--org);box-shadow:0 0 0 3px rgba(255,153,0,.3)}
.line{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:.92rem}
.line.t{font-weight:800;border-top:1px dashed var(--br);margin-top:6px;padding-top:8px}
.muted{color:var(--mut);font-size:.85rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:start;padding:10px 8px;border-bottom:1px solid #e7e7e7;white-space:nowrap}
th{background:#f3f3f3;font-weight:700}
.tw{overflow-x:auto;padding:0}

/* ---- نوافذ ---- */
.ov{position:fixed;inset:0;background:rgba(15,17,17,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px;animation:up .2s}
.sheet.wide{max-width:680px}
@media(min-width:720px){.ov{align-items:center}
.sheet{border-radius:12px}
}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.toast{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:92vw;background:var(--nav2);color:#fff;border-radius:10px;padding:11px 18px;z-index:99;box-shadow:var(--sh);display:flex;gap:12px;align-items:center}
.toast.err{background:var(--bad)}

/* ---- الدخول ---- */
.auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px;background:#fff}
.auth .wm{display:flex;align-items:center;gap:10px;font-size:1.8rem;font-weight:800;margin-bottom:18px}
.auth .wm .logo{width:44px;height:44px;font-size:1.4rem}
.auth .card{width:100%;max-width:380px;padding:22px 26px;box-shadow:none}
.auth h2{margin-bottom:4px}
.tabs{display:flex;background:#f0f2f2;border-radius:8px;padding:3px;margin:12px 0}
.tabs button{flex:1;padding:7px;border-radius:6px;background:transparent;font-weight:700;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--tx);box-shadow:var(--sh)}
.hero{text-align:center}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:6px;background:#f0f2f2;border:1px solid var(--br);font-weight:800}
.cod{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:8px;padding:10px 12px;font-weight:700;margin-top:10px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.banner{background:linear-gradient(135deg,#067d62,#0aa37f);color:#fff;border-radius:var(--r);padding:14px 18px;font-weight:700;margin-bottom:6px}

/* ---- الفوتر ---- */
.foot .totop{display:block;width:100%;background:#37475a;color:#fff;padding:13px;font-weight:600}
.foot .totop:hover{background:#485769}
.foot .fin{background:var(--nav);color:#ccc;text-align:center;padding:18px;font-size:.88rem}

/* ---- تحسينات الواجهة ---- */
input,select{min-height:44px;font-size:1rem}
.btn{min-height:42px}
.btn.sm{min-height:34px}
.card{border-radius:14px}
.sec{margin-bottom:14px}
.sec h3{margin-bottom:4px}
.note{background:#fff8e6;border:1px solid #fde1a0;color:#6b4a00;border-radius:8px;padding:9px 12px;font-size:.85rem;margin-top:10px}
.cbbox{margin-top:14px;background:#f7fafa}
.tagc{display:inline-block;background:#e7e7e7;border-radius:99px;padding:1px 10px;font-size:.8rem;font-weight:700}
.tagc.sp{background:#fff3cd;color:#7a5200}
.bnav{display:none}
@media(max-width:719px){nav.sub{display:none}
.bnav{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:40;background:#fff;border-top:1px solid var(--br);box-shadow:0 -2px 8px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;position:relative;background:none;padding:7px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:1.25rem;color:var(--mut);line-height:1.2}
.bnav button small{font-size:.66rem;font-weight:700}
.bnav button.on{color:var(--nav2)}
.bnav button.on small{color:#c45500}
.bnav .badge{inset-inline-start:50%;margin-inline-start:6px}
main{padding-bottom:90px}
.foot .totop{display:none}
.foot{margin-bottom:62px}
.toast{bottom:76px}
.hbtn small{display:none}
}

/* ---- وزن / وحدة ---- */
.wrow{display:flex;align-items:center;gap:6px}
.wrow input{min-height:38px;text-align:center;font-weight:700;padding:4px 8px}
.gu{font-weight:700;color:var(--mut);font-size:.85rem}
.wch{display:flex;gap:4px;flex-wrap:wrap}
.wch button{flex:1;min-width:38px;background:#fff;border:1px solid var(--br);border-radius:99px;padding:3px 4px;font-size:.78rem;font-weight:700}
.wp{font-size:.88rem;color:var(--mut);text-align:center}
.wp b{color:var(--price);font-size:1rem}
.qv{min-width:70px;text-align:center}

/* ---- أنيميشن ---- */
button,.btn,.chip,.brand,.hbtn,.cartbtn{transition:transform .14s cubic-bezier(.3,.7,.4,1),background-color .15s,box-shadow .15s,border-color .15s,opacity .15s}
button:not(:disabled):active,.brand:active,.hbtn:active,.cartbtn:active{transform:scale(.94)}
.btn,.buy,.chip,.tabs button,.qty button,.bnav button,nav.sub button,.search button,.totop,.wch button,.pc{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
.pc>.rip{opacity:.1}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.pc{transition:box-shadow .2s,transform .2s}
.pc:hover{transform:translateY(-3px)}
.pc.in{animation:cin .45s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i)*45ms)}
@keyframes cin{from{opacity:0;transform:translateY(18px) scale(.96)}}
main.vin{animation:vin .35s ease both}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}
.ov{animation:fin .22s ease}
.sheet{animation:up .38s cubic-bezier(.2,.9,.3,1.12)}
.ov.out{animation:fout .2s ease forwards}
.ov.out .sheet{animation:sout .2s ease forwards}
.noanim,.noanim .sheet{animation:none!important}
@keyframes fin{from{opacity:0}}
@keyframes fout{to{opacity:0}}
@keyframes sout{to{transform:translateY(30px) scale(.97);opacity:0}}
.toast{animation:tin .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes tin{from{transform:translateY(24px) scale(.96);opacity:0}}
.cartbtn .ic{display:inline-block}
.cartbtn .ic.bump{animation:bump .5s}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.4) rotate(-12deg)}60%{transform:scale(.9) rotate(6deg)}100%{transform:scale(1)}}
.fly{position:fixed;z-index:100;width:46px;height:46px;border-radius:50%;background:#e7f0d8 center/cover no-repeat;box-shadow:0 6px 18px rgba(0,0,0,.3);display:grid;place-items:center;font-size:1.5rem;pointer-events:none;border:2px solid #fff}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-inline-end:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.okc{width:84px;height:84px;display:block;margin:0 auto 6px}
.okc circle{stroke:var(--ok);stroke-width:4;fill:none;stroke-dasharray:264;stroke-dashoffset:264;animation:dash .75s ease forwards}
.okc path{stroke:var(--ok);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dash .55s .65s ease forwards}
@keyframes dash{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
body.busy::before{content:"";position:fixed;top:0;inset-inline:0;height:3px;z-index:200;background:linear-gradient(90deg,transparent,var(--org),transparent) no-repeat;background-size:40% 100%;animation:bar 1s linear infinite}
@keyframes bar{from{background-position:-40% 0}to{background-position:140% 0}}
.hs{height:150px;padding:0}
.hslide{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px 26px;opacity:0;transform:translateX(-26px);transition:opacity .55s,transform .55s;pointer-events:none;cursor:pointer}
.hslide.on{opacity:1;transform:none;pointer-events:auto;z-index:1}
.htx{position:relative;min-width:0}
.hslide h1{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hslide img{height:104px;width:104px;object-fit:contain;background:#fff;border-radius:12px;padding:4px;position:relative;flex:none}
.hdots{position:absolute;bottom:8px;inset-inline:0;display:flex;justify-content:center;gap:5px;z-index:2}
.hdots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.4);transition:.3s}
.hdots i.on{width:20px;background:var(--org)}
.trust{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.trust span{flex:1 0 auto;background:#fff;border:1px solid var(--br);border-radius:99px;padding:6px 14px;font-size:.82rem;font-weight:700;white-space:nowrap;text-align:center}
.disc{font-size:.95rem;font-weight:800;padding:3px 10px;border-radius:6px}
.pc.hl{box-shadow:0 0 0 3px var(--org)}
.cd{font-size:.8rem;font-weight:700;color:var(--bad);background:#fff1ee;border-radius:6px;padding:2px 8px;text-align:center}
.cd b{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.prog{display:flex;margin:12px 0 6px}
.ps{flex:1;text-align:center;position:relative;color:var(--mut)}
.ps+.ps:before{content:"";position:absolute;top:15px;inset-inline-end:50%;width:100%;height:3px;background:var(--br);transition:background .4s}
.ps+.ps.done:before{background:var(--ok)}
.pi{position:relative;z-index:1;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--br);margin:0 auto 2px;font-size:.9rem}
.ps.done .pi{background:var(--ok);border-color:var(--ok);color:#fff}
.ps.done{color:var(--tx)}
.ps.cur .pi{animation:pulse 1.6s infinite}
.ps small{font-size:.7rem;font-weight:700}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(6,125,98,.4)}100%{box-shadow:0 0 0 9px rgba(6,125,98,0)}}
.pwa{position:fixed;inset-inline:12px;bottom:76px;z-index:60;background:var(--nav2);color:#fff;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;animation:tin .35s}
.pwa span{flex:1;font-weight:700;font-size:.9rem}
@media(min-width:720px){.pwa{bottom:20px;max-width:420px;margin:auto}
}
.sug{position:fixed;z-index:70;background:#fff;color:var(--tx);border:1px solid var(--br);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);overflow:hidden;animation:tin .2s}
.si{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid #f0f2f2}
.si:last-child{border:0}
.si:hover{background:#f7fafa}
.si img,.ph2{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none;display:grid;place-items:center;background:#eef3ea}
.sn{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si b{color:var(--price);font-size:.9rem}

/* ============ تصميم المتجر الجديد ============ */
.btn{border-color:var(--yel2)}
.btn.ok{color:#fff;border-color:#55632a}
.btn.ok:hover{background:#5a6a2b}

/* البانر */
.hero-b{background:linear-gradient(120deg,#3b4620,#5f6f2e 65%,#7d8e41);border-radius:18px}
.hero-b:after{background:rgba(209,169,79,.25)}
.hs{height:180px}
.hslide{padding:16px 18px 26px;gap:14px}
.htx{flex:1}
.hslide h1{font-size:1.25rem;-webkit-line-clamp:1}
.hslide p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.88rem}
.hslide img{width:112px;height:112px;object-fit:cover;border-radius:18px;padding:0;border:3px solid rgba(255,255,255,.85);box-shadow:0 6px 18px rgba(0,0,0,.25)}

}

/* ===== المرحلة 2 ===== */
.pvbar{top:var(--hh2,64px)}
.pimg{aspect-ratio:var(--cratio,1/1)}
.pc{border-radius:var(--cr,16px)}
body.no-disc .pc .disc,body.no-disc .mi i{display:none}
body.no-old .pc .old{display:none}
body[data-cs=minimal] .pc{box-shadow:none;border-color:transparent;background:transparent}
body[data-cs=bold] .pc{border:2px solid var(--olive)}
body[data-cs=bold] .pname{font-weight:800}
.tk{animation-duration:var(--tks,40s)}
.gcs{position:relative;border:2px dashed var(--gold);border-radius:14px;padding:6px;margin-bottom:10px}
.gcs.off{opacity:.6}
.gct{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;background:var(--cream);border-radius:10px;padding:4px 8px;margin-bottom:6px;font-size:.82rem}

.gce{position:absolute;top:8px;inset-inline-end:8px;z-index:3;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;font-size:1rem}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
input[type=color]{padding:2px;min-height:44px;cursor:pointer}
input[type=range]{padding:0;min-height:30px}

/* ================= حركات إضافية — transform/opacity فقط، وتحترم prefers-reduced-motion ================= */

/* 1) Skeleton */
.skl{min-height:100vh}
.sk-top{background:var(--nav);height:58px;display:flex;align-items:center;gap:12px;padding:0 14px}
.sk-top i{display:block;background:rgba(255,255,255,.14);border-radius:8px;height:34px}
.sk-top .a{width:34px}
.sk-top .b{flex:1}
.sk-top .c{width:70px}
.sk-wrap{padding:14px;max-width:1280px;margin:0 auto}
.sk-hero,.sk-card{position:relative;overflow:hidden;border-radius:var(--r)}
.sk-hero{height:150px;margin-bottom:14px;background:#e6e2d4}
.sk-card{background:#fff;border:1px solid var(--br);padding-bottom:10px}
.sk-card i{display:block;background:#ece9de;border-radius:6px;margin:8px 10px 0}
.sk-card .im{aspect-ratio:1/1;margin:0 0 6px;border-radius:0}
.sk-card .l{height:11px;width:80%}
.sk-card .l.s{width:50%}
.sk-card .p{height:14px;width:35%}
.sk-hero::after,.sk-card::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 25%,rgba(255,255,255,.7) 50%,transparent 75%);transform:translateX(100%);animation:shm 1.3s ease-in-out infinite;animation-delay:calc(var(--i,0)*70ms)}
@keyframes shm{to{transform:translateX(-100%)}}

/* 2+12) دخول البطاقات بالتتابع عند ظهورها في الشاشة */
.pc.rv{opacity:0;transform:translateY(18px) scale(.96)}
.pc.rv.shown{opacity:1;transform:none;transition:opacity .45s cubic-bezier(.2,.8,.3,1) var(--d,0ms),transform .45s cubic-bezier(.2,.8,.3,1) var(--d,0ms)}

/* 4) عدّاد السلة */
.cartbtn .cn.pop{animation:cpop .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes cpop{0%{transform:scale(.4)}60%{transform:scale(1.3)}100%{transform:scale(1)}}

/* 6) السحب والإفلات */
.sit::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 16px 32px rgba(0,0,0,.32);opacity:0;transition:opacity .2s;pointer-events:none;z-index:-1}
.sit.drag{box-shadow:none;will-change:transform}
.sit.drag::before{opacity:1;animation:lift .8s ease-in-out infinite alternate}
@keyframes lift{from{opacity:.55}to{opacity:1}}

/* شريط البحث: كبسولة هادئة + أيقونات SVG */
.search{border-radius:999px;overflow:visible;background:#fff;padding:3px;align-items:center;gap:2px;box-shadow:0 0 0 1px rgba(0,0,0,.06);transition:box-shadow .2s ease}
.search:focus-within{box-shadow:0 0 0 3px rgba(209,169,79,.55)}
.search input{background:transparent;border-radius:999px;padding:9px 14px}
.search input::placeholder{color:#8a8f86;transition:color .2s}
.search .vb,.search .sb{flex:none;width:38px;height:38px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;font-size:0;line-height:0}
.search .vb svg,.search .sb svg{width:20px;height:20px;display:block;transition:transform .22s cubic-bezier(.3,.7,.4,1)}
.search .vb{background:transparent;color:#5f6f2e;transition:background-color .2s,color .2s}
.search .vb:hover{background:#f1efe6}
.search .vb:hover svg{transform:scale(1.1)}
.search .sb{background:var(--org);color:var(--nav);transition:background-color .2s,transform .14s}
.search .sb:hover{background:#c99a3c}
.search .sb:hover svg{transform:rotate(-14deg) scale(1.08)}
.search:focus-within .sb svg{transform:scale(1.06)}
.search .sb.go svg{animation:scan .7s cubic-bezier(.4,0,.2,1)}
@keyframes scan{0%{transform:translate(0,0) rotate(0)}22%{transform:translate(2px,-2px) rotate(10deg)}48%{transform:translate(-1px,-3px) rotate(-6deg)}74%{transform:translate(-2px,0) rotate(-12deg)}100%{transform:translate(0,0) rotate(0)}}

/* ميكروفون: دائرة حمراء + دوائر صدى (sonar) أثناء الاستماع */
.search .vb.listening{background:var(--bad);color:#fff}
.search .vb.listening:hover{background:var(--bad)}
.search .vb.listening svg{animation:micb 1.3s ease-in-out infinite}
@keyframes micb{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.vb.listening::before,.vb.listening::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.65);transform:scale(.35);opacity:0;animation:sonar 1.6s ease-out infinite;pointer-events:none}
.vb.listening::after{animation-delay:.8s}
@keyframes sonar{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1);opacity:0}}

/* 8) نبضة الطلب الجديد على تاب الطلبات */
.badge.fresh{animation:bpulse 1s ease-in-out infinite}
@keyframes bpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
nav.sub button.hot::before,.bnav button.hot::before{content:"";position:absolute;inset:0;background:var(--org);opacity:0;animation:tflash 1.6s ease-in-out infinite;pointer-events:none}
@keyframes tflash{50%{opacity:.3}}

/* 10) Hero parallax */
.hslide .htx{transform:translateX(-46px);transition:transform .8s cubic-bezier(.2,.8,.3,1) .05s}
.hslide img{transform:translateX(-90px) scale(.88);transition:transform 1s cubic-bezier(.2,.8,.3,1) .12s,opacity .6s}
.hslide.on .htx{transform:none}
.hslide.on img{transform:none;animation:kb 7s ease-out .8s both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}

/* 13) اقتراحات البحث */

<script>
/* ============ أدوات ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* تخزين محلي آمن: لا يكسر التطبيق عند تلف JSON أو امتلاء/منع التخزين */
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));return true}catch{return false}};
const loadCart=()=>{const a=lsGet('shop_cart',[]);if(!Array.isArray(a))return[];const seen=new Set();return a.filter(i=>i&&typeof i.id==='string'&&isFinite(+i.qty)&&+i.qty>0&&!seen.has(i.id)&&seen.add(i.id)).map(i=>({id:i.id,qty:Math.round(+i.qty*1000)/1000}))};
const state={user:null,settings:{store_name:'المتجر',currency:'ج.م',shipping_fee:0,free_shipping_over:0,admin_whatsapp:'',announcement:'',cashback_percent:0,cashback_min_order:0},secret:'',cq:'',products:[],cart:loadCart(),view:'shop',cat:'all',q:'',orders:[],customers:[],newCount:0,newCust:0,ofilter:'all',fresh:new Set()};

/* ============ البيع بالكيلو / بالوحدة ============ */
/* ملاحظة: نوع البيع محفوظ داخل عمود category الموجود أصلاً ('__kg' = بالكيلو) بدون أي تغيير في قاعدة البيانات */
const isKg=p=>!!p&&String(p.category||'').split('##')[0].split('@@')[0]==='__kg';
const secOf=p=>String((p&&p.category)||'').split('##')[0].split('@@')[1]||'';
const MING=50,MAXKG=20,MAXU=99,BIGSTOCK=999999;
const gramsTxt=g=>g>=1000?`${+(g/1000).toFixed(3)} كجم`:`${Math.round(g)} جرام`;
const qlabel=(p,q)=>isKg(p)?gramsTxt(q*1000):`× ${q}`;
const findP=i=>state.products.find(p=>p.id===(i.id||i.product_id))||state.products.find(p=>p.name===i.name);
const itemQ=i=>qlabel(findP(i),i.qty);
const buildMsg=m=>[`🌿 *طلب جديد — ${state.settings.store_name}*`,`رقم الطلب: *#${m.no}*`,'━━━━━━━━━━━━━━',`👤 ${m.name||''}`,`📞 ${m.phone}`,`📍 ${m.address}`,'━━━━━━━━━━━━━━','🛒 *المنتجات*',...m.items.map((i,n)=>`${n+1}) ${i.name} — ${i.label} — ${fmt(i.sum)}`),'━━━━━━━━━━━━━━',+m.ship>0?`🚚 الشحن: ${fmt(m.ship)}`:'🚚 الشحن: مجاني',+m.used>0?`🎁 خصم كاش باك: -${fmt(m.used)}`:'',`💰 *الإجمالي: ${fmt(m.total)}*`,'💵 الدفع عند الاستلام',m.notes?`📝 ملاحظات: ${m.notes}`:''].filter(Boolean).join('\n');
function updWp(c){const p=state.products.find(x=>x.id===c.dataset.id);if(!p)return;const g=+c.querySelector('.gin').value||0,w=c.querySelector('.wp b');if(w)countTo(w,p.price*g/1000,fmt,350);c.querySelectorAll('.wch button').forEach(b=>b.classList.toggle('on',+b.dataset.g===g))}
function fly(from,p){if(!from||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const t=document.querySelector('.cartbtn .ic');if(!t)return;const tr=t.getBoundingClientRect(),d=document.createElement('div');d.className='fly';if(im1(p))d.style.backgroundImage=`url("${String(im1(p)).replace(/["\\\n\r()]/g,c=>encodeURIComponent(c))}")`;else d.textContent='🌿';
 const x0=from.left+from.width/2-23,y0=from.top+from.height/2-23;d.style.left=x0+'px';d.style.top=y0+'px';document.body.appendChild(d);
 const dx=tr.left+tr.width/2-23-x0,dy=tr.top+tr.height/2-23-y0;

function supaAPI(url,key){
 const sb=supabase.createClient(url,key);
 const api={mode:'supabase',sb,
  async profile(id){return unwrap(await sb.from('profiles').select('*').eq('id',id).single())},
  async session(){const{data}=await sb.auth.getSession();return data.session?api.profile(data.session.user.id):null},
  async signUp(name,email,password,phone){const r=await sb.auth.signUp({email,password,options:{data:{name,phone}}});if(r.error)throw r.error;if(!r.data.session){/* لو التفعيل التلقائي شغال بنكمل دخول مباشرة */const s=await sb.auth.signInWithPassword({email,password});if(s.error)return{confirm:true};return{profile:await api.profile(s.data.user.id)}}return{profile:await api.profile(r.data.user.id)}},
  async signIn(email,password){const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;return api.profile(r.data.user.id)},
  async signOut(){try{await sb.removeAllChannels()}catch{}return sb.auth.signOut()},
  async settings(){return unwrap(await sb.from('settings').select('*').eq('id',1).single())},
  async saveSettings(s){unwrap(await sb.from('settings').update(s).eq('id',1))},
  async applyGlobalCashback(p,m){unwrap(await sb.from('profiles').update({cashback_percent:p,cashback_min_order:m}).eq('cashback_custom',false))},
  async products(){const r=unwrap(await sb.from('products').select('*').order('created_at',{ascending:false}));trackPrices(r);return r},
  async saveProduct(p){unwrap(p.id?await sb.from('products').update(p).eq('id',p.id):await sb.from('products').insert(p))},
  async saveOrder(list){for(let i=0;i<list.length;i+=10){const r=await Promise.all(list.slice(i,i+10).map(x=>sb.from('products').update({sort_order:x.sort_order,pinned:x.pinned}).eq('id',x.id)));r.forEach(unwrap)}},
  async adminLog(target){let q=sb.from('admin_log').select('*').order('created_at',{ascending:false}).limit(80);if(target)q=q.eq('target_id',String(target));return unwrap(await q)},
  async loginLog(email){let q=sb.from('login_log').select('*').order('created_at',{ascending:false}).limit(80);if(email)q=q.eq('email',email);return unwrap(await q)},
  logLogin(email,ok,uid){try{sb.from('login_log').insert({email,success:ok,user_id:uid||null,user_agent:String(navigator.userAgent).slice(0,200)}).then(()=>{},()=>{})}catch{}},
  async setCategories(list){for(let i=0;i<list.length;i+=10){const r=await Promise.all(list.slice(i,i+10).map(x=>sb.from('products').update({category:x.category}).eq('id',x.id)));r.forEach(unwrap)}},
  async delProduct(id){unwrap(await sb.from('products').delete().eq('id',id))},
  async uploadImage(file){const path=Date.now()+'_'+file.name.replace(/[^\w.]/g,'');const r=await sb.storage.from('products').upload(path,file);if(r.error)throw r.error;return sb.storage.from('products').getPublicUrl(path).data.publicUrl},
  async placeGuestOrder(o){return unwrap(await sb.rpc('place_guest_order',{p_items:o.items,p_name:o.name,p_phone:o.phone,p_address:o.address,p_notes:o.notes||''}))},
  async placeOrder(o){return unwrap(await sb.rpc('place_order',{p_items:o.items,p_address:o.address,p_phone:o.phone,p_notes:o.notes,p_use_cashback:o.useCashback}))},
  async orders(){return unwrap(await sb.from('orders').select('*, profiles(name,email,phone)').order('created_at',{ascending:false}))},
  async setStatus(id,s){return unwrap(await sb.rpc('set_order_status',{p_order_id:id,p_status:s}))},
  async clearOrders(){return unwrap(await sb.rpc('admin_clear_orders'))},
  async restoreOrders(batch){return unwrap(await sb.rpc('admin_restore_orders',{p_batch:batch}))},
  async trashInfo(){return unwrap(await sb.rpc('admin_trash_info'))},
  async customers(){return unwrap(await sb.from('profiles').select('*').order('created_at',{ascending:false}))},
  async updateCustomer(id,f){unwrap(await sb.from('profiles').update(f).eq('id',id))},
  async updateMe(f){unwrap(await sb.rpc('update_my_profile',{p_name:f.name,p_phone:f.phone,p_address:f.address}))},
  onNewOrder(cb){sb.channel('orders-rt').on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},p=>cb(p.new)).subscribe()},
  onNewCustomer(cb){sb.channel('profiles-rt').on('postgres_changes',{event:'INSERT',schema:'public',table:'profiles'},p=>cb(p.new)).subscribe()},
  onOrderUpdate(cb){sb.channel('orders-upd').on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders'},p=>cb(p.new)).subscribe()}
 };return api}

const nrm=t=>String(t||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const SYN=[['حبة البركة','حبه سودا','حبة سوداء','سودا','سوداء','كالونجي','حبه البركه','حبه سوداء'],['كركم','تيرمريك'],['قرفة','قرفه','سينامون'],['ينسون','انيسون'],['شمر','شمرة','فنيل'],['حلبة','ميتي'],['زنجبيل','جنزبيل','جنجر'],['هيل','حبهان','حب هان','قاقلة','كاردامون'],['نعناع','مينت'],['بابونج','بابونك','كاموميل'],['شاي اخضر','جرين تي'],['عرقسوس','عرق سوس'],['كراوية','كراويه'],['مستكة','مستكه'],['ورق لورا','لورا','ورق الغار','غار'],['فلفل اسود','فلفل'],['قرنفل','كبش قرنفل'],['كمون','كمن'],['كزبرة','كسبرة','كزبره'],['خلطة','بهارات','توابل']];
const SYNN=SYN.map(g=>g.map(nrm));
const synHit=(t,hay)=>{const g=SYNN.find(g=>g.includes(t));return !!g&&g.some(m=>hay.includes(m))};
function matchP(p,q){const t=nrm(q).trim();if(!t)return true;const hay=nrm(p.name+' '+(p.description||'')+' '+(p.keywords||'')),hw=hay.split(/\s+/);if(synHit(t,hay))return true;return t.split(/\s+/).every(w=>hay.includes(w)||synHit(w,hay)||hw.some(h=>lev(w,h)<=(w.length>5?2:w.length>2?1:0)))}
function kwSug(q){const t=nrm(q).trim().split(/\s+/).pop();if(!t||t.length<2)return[];const seen=new Set(),out=[];state.products.filter(p=>p.active).forEach(p=>(p.name+' '+(p.keywords||'')).split(/[\s,،]+/).forEach(w=>{const n=nrm(w);if(n.length>2&&n.startsWith(t)&&n!==t&&!seen.has(n)){seen.add(n);out.push(w)}}));return out.slice(0,3)}

 const days=[];for(let i=29;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(day(d))}
 const sales=Object.fromEntries(days.map(k=>[k,0]));live.forEach(o=>{const k=day(o.created_at);if(k in sales)sales[k]+=Number(o.total)});
 const vals=days.map(k=>sales[k]),max=Math.max(...vals,1),tot=vals.reduce((a,b)=>a+b,0);

 <div class="card sec"><h3>⏰ ساعات الذروة${hm?` — الأكثر طلباً: ${hl(peak)}`:''}</h3><svg viewBox="0 0 600 57" style="width:100%;height:auto;margin-top:8px">${hb}</svg><div class="line muted"><span>12 ص</span><span>12 م</span><span>11 م</span></div></div>

function initSortables(){document.querySelectorAll('.sl[data-sl]').forEach(root=>{
 root.onpointerdown=e=>{const h=e.target.closest('.dh');if(!h)return;const it=h.closest('.sit');if(!it||it.parentNode!==root)return;
  e.preventDefault();try{h.setPointerCapture(e.pointerId)}catch{}
  const orig=[...root.children].map(x=>x.dataset.id).join('|');let y0=e.clientY;it.classList.add('drag');
  const mv=ev=>{let sy=scrollY;if(ev.clientY<80)scrollBy(0,-14);else if(ev.clientY>innerHeight-80)scrollBy(0,14);y0-=scrollY-sy;
   it.style.transform=`translateY(${ev.clientY-y0}px) scale(1.02)`;
   const c=it.getBoundingClientRect(),cy=c.top+c.height/2;
   for(const s of [...root.children]){if(s===it)continue;const r=s.getBoundingClientRect(),m=r.top+r.height/2,after=!!(it.compareDocumentPosition(s)&Node.DOCUMENT_POSITION_FOLLOWING);
    if((after&&cy>m)||(!after&&cy<m)){const st=s.getBoundingClientRect().top,b=it.getBoundingClientRect().top;if(after)s.after(it);else s.before(it);y0+=it.getBoundingClientRect().top-b;it.style.transform=`translateY(${ev.clientY-y0}px) scale(1.02)`;flip(s,st);break}}};
  const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);it.classList.remove('drag');it.style.transition='transform .2s cubic-bezier(.2,.8,.3,1)';it.style.transform='';setTimeout(()=>{it.style.transition=''},230);
   const ids=[...root.children].map(x=>x.dataset.id);if(ids.join('|')!==orig)onSort(root.dataset.sl,ids)};
  h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)}})}

Object.assign(ACT,{
 fxdef:()=>{modal(`<h3>🖼️ ضبط عرض الصور (كل المنتجات)</h3><p class="muted">يُطبَّق على كل المنتجات التي ليس لها ضبط خاص. يمكنك ضبط منتج بعينه من نموذج تعديل المنتج.</p><form data-form="fxdef">${fxCtl(curLayout().pimg,'')}<div class="row" style="margin-top:14px"><button class="btn ok">حفظ</button><button type="button" class="btn sec" data-act="close">إلغاء</button></div></form>`);document.querySelectorAll('#modal .fxwrap').forEach(updateFx)},
 fxreset:el=>{const w=el.closest('.fxwrap'),d=nfx({});w.querySelector('[data-fx=fit]').value=d.fit;w.querySelector('[data-fx=zoom]').value=d.zoom;w.querySelector('[data-fx=x]').value=d.x;w.querySelector('[data-fx=y]').value=d.y;updateFx(w)}});

const openLogo=()=>modal(`<h3>🖼️ تعديل اللوجو</h3>`+`<p class="muted">يظهر في الهيدر أعلى الصفحة وفي شاشة الدخول. يُفضّل PNG بخلفية شفافة.</p>
 <div style="background:var(--nav);border-radius:12px;padding:8px 12px;display:inline-flex;align-items:center;gap:8px;color:#fff;font-weight:800;margin:10px 0">${logoHtml()}${brandName()}</div>
 <label>رفع صورة اللوجو</label><input type="file" accept="image/*" data-logoup>
 <label>أو رابط الصورة</label><input id="logourl" dir="ltr" value="${esc(normLay(state.settings.layout).logo)}" placeholder="https://...">
 <div class="row" style="margin-top:8px"><button type="button" class="btn sec bt" data-act="logosave">حفظ الرابط</button><button type="button" class="btn sec bt" style="color:var(--bad)" data-act="logorm">إزالة اللوجو</button></div>
 <label class="ck" style="margin-top:10px"><input type="checkbox" data-logoonly ${normLay(state.settings.layout).logoOnly?'checked':''}> إخفاء اسم المتجر بجانب اللوجو (لو اللوجو يحتوي الاسم)</label>
 ${state.hasLayout?'':'<div class="note">لحفظ اللوجو شغّل ملف <b>designer_update.sql</b> مرة واحدة في Supabase.</div>'}`+`<button type="button" class="btn sec" style="width:100%;margin-top:12px" data-act="close">إغلاق</button>`);
Object.assign(ACT,{
 logoedit:()=>openLogo(),
 logosave:()=>{const u=($('#logourl')?.value||'').trim();closeModal();saveLay(l=>{l.logo=u},u?'تم حفظ اللوجو ✓':'تمت إزالة اللوجو')},
 logorm:()=>{if(confirm('إزالة اللوجو والعودة للأيقونة الافتراضية؟')){closeModal();saveLay(l=>{l.logo='';l.logoOnly=false},'تمت إزالة اللوجو')}}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.matches&&t.matches('[data-logoup]')&&t.files[0]){try{toast('جارٍ رفع اللوجو...');const u=await API.uploadImage(t.files[0]);closeModal();await saveLay(l=>{l.logo=u},'تم تغيير اللوجو ✓')}catch(er){toast('فشل الرفع: '+errMsg(er),true)}}
 if(t.matches&&t.matches('[data-logoonly]')){const v=t.checked;closeModal();saveLay(l=>{l.logoOnly=v},'تم الحفظ ✓')}});
(async()=>{try{const V='v4';if(localStorage.getItem('shop_ver')!==V){localStorage.setItem('shop_ver',V);if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}location.reload()}}catch{}})();
boot();
</script>
</body>
</html>
